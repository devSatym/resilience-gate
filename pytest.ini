[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = -ra --strict-config --strict-markers --import-mode=importlib --allow-unix-socket -m "not integration"
markers =
    integration: requires explicitly started local dependencies; skipped by default
    live: requires an owned testnet environment; never run in ordinary CI
