name: Validate local API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - name: Install locked test environment
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run local validation
        run: ./scripts/validate.sh
      - name: Exercise marked recovery contract
        run: python -m pytest -m integration tests/integration/test_local_recovery.py
      - name: Build local application image
        run: docker build --tag resilience-gate-app:ci ./app

  signer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signer test environment
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --requirement signer/requirements.lock
      - name: Run hermetic signer tests
        run: python -m pytest signer/test_permit2.py tests/signer
      - name: Build signer image
        run: docker build --tag resilience-gate-signer:ci ./signer
