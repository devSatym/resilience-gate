name: Validate local API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.1
      - name: Install locked test environments
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --requirement signer/requirements.lock
      - name: Run local validation
        run: ./scripts/validate.sh
      - name: Exercise marked recovery contract
        run: python -m pytest -m integration tests/integration/test_local_recovery.py
      - name: Build local application image
        run: docker build --tag resilience-gate-app:ci ./app

  signer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install signer test environment
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --requirement signer/requirements.lock
      - name: Run hermetic signer tests
        run: python -m pytest signer/test_permit2.py tests/signer
      - name: Build signer image
        run: docker build --tag resilience-gate-signer:ci ./signer

  gate-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The build context is the repository root because the runner bakes the
      # reviewed scorer/orchestrator rather than mounting mutable scripts.
      - name: Build immutable gate-runner image
        run: docker build --tag resilience-gate-gate-runner:ci --file docker/gate-runner/Dockerfile .
