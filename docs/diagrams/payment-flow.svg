<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768" role="img" aria-labelledby="title desc">
<title id="title">x402 and Permit2 payment sequence</title>
<desc id="desc">Client receives an HTTP402 challenge, obtains a Permit2 authorization from the isolated signer, and submits the signed request. App verifies then settles via the facilitator and persists a URL before HTTP201. GET redirects with302; replay of the same settlement is rejected with409. Settlement and database persistence are not atomic.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#53e3c2"/><stop offset="1" stop-color="#70b9ff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#476079" opacity=".23"/></pattern>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#829db8"/></marker></defs>
<rect width="1280" height="768" rx="22" fill="url(#bg)"/>
<rect width="1280" height="768" rx="22" fill="url(#grid)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="50" y="43" font-size="14" fill="#53e3c2" font-weight="700" text-anchor="start">04 / PAID WORKLOAD</text>
<text x="50" y="91" font-size="34" fill="#edf5ff" font-weight="700" text-anchor="start">A real payment path inside the release test.</text>
<text x="50" y="126" font-size="19" fill="#a9bbd1" font-weight="400" text-anchor="start">Owned Radius testnet · server-owned payment terms · isolated signing boundary</text>
<rect x="50" y="162" width="253" height="61" rx="16" fill="#122139" stroke="#2a3e58"/>
<text x="176" y="201" font-size="22" fill="#70b9ff" font-weight="700" text-anchor="middle">Client / k6</text>
<path d="M176 233 L176 662" fill="none" stroke="#36506a" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="359" y="162" width="253" height="61" rx="16" fill="#122139" stroke="#2a3e58"/>
<text x="485" y="201" font-size="22" fill="#af9bff" font-weight="700" text-anchor="middle">Permit2 signer</text>
<path d="M485 233 L485 662" fill="none" stroke="#36506a" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="668" y="162" width="253" height="61" rx="16" fill="#122139" stroke="#2a3e58"/>
<text x="794" y="201" font-size="22" fill="#53e3c2" font-weight="700" text-anchor="middle">FastAPI app</text>
<path d="M794 233 L794 662" fill="none" stroke="#36506a" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="977" y="162" width="253" height="61" rx="16" fill="#122139" stroke="#2a3e58"/>
<text x="1103" y="201" font-size="22" fill="#ffc776" font-weight="700" text-anchor="middle">Facilitator</text>
<path d="M1103 233 L1103 662" fill="none" stroke="#36506a" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M176 276 L794 276" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="186" y="247" width="598" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="485" y="266" font-size="17" fill="#70b9ff" font-weight="400" text-anchor="middle">POST /shorten → 402 Payment Required</text>
<path d="M176 337 L485 337" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="186" y="308" width="289" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="330" y="327" font-size="17" fill="#af9bff" font-weight="400" text-anchor="middle">Get Permit2 authorization</text>
<path d="M176 398 L794 398" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="186" y="369" width="598" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="485" y="388" font-size="17" fill="#70b9ff" font-weight="400" text-anchor="middle">Retry with PAYMENT-SIGNATURE</text>
<path d="M794 459 L1103 459" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="804" y="430" width="289" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="948" y="449" font-size="17" fill="#ffc776" font-weight="400" text-anchor="middle">/verify → /settle</text>
<rect x="679" y="481" width="230" height="32" rx="16" fill="#10263a" stroke="#53e3c2"/>
<text x="794" y="503" font-size="14" fill="#53e3c2" font-weight="700" text-anchor="middle">PERSIST URL + AUDIT</text>
<path d="M794 550 L176 550" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="186" y="521" width="598" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="485" y="540" font-size="17" fill="#53e3c2" font-weight="400" text-anchor="middle">201 Created after settlement + persistence</text>
<path d="M176 611 L794 611" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="186" y="582" width="598" height="24" rx="4" fill="#0b182a" stroke="#0b182a"/>
<text x="485" y="601" font-size="17" fill="#70b9ff" font-weight="400" text-anchor="middle">GET code → 302 redirect · replay → 409</text>
<rect x="50" y="685" width="1180" height="42" rx="10" fill="#251e34" stroke="#654458"/>
<text x="73" y="712" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Consistency boundary: settlement and database persistence require reconciliation after partial failure.</text>
<text x="50" y="752" font-size="13" fill="#a9bbd1" font-weight="400" text-anchor="start">CONCEPTUAL SOURCE DIAGRAM · runtime evidence is linked separately</text>
</g></svg>
