<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Resilience Gate</title>
<desc id="desc">Chaos-verified Kubernetes releases: immutable artifacts, paid traffic, measured recovery, and evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#53e3c2"/><stop offset="1" stop-color="#70b9ff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#476079" opacity=".23"/></pattern>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#829db8"/></marker></defs>
<rect width="1280" height="360" rx="22" fill="url(#bg)"/>
<rect width="1280" height="360" rx="22" fill="url(#grid)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="58" y="59" font-size="16" fill="#53e3c2" font-weight="700" text-anchor="start">BUILD · PROMOTE · BREAK · RECOVER · PROVE</text>
<text x="53" y="145" font-size="66" fill="#edf5ff" font-weight="700" text-anchor="start">RESILIENCE GATE</text>
<text x="58" y="198" font-size="28" fill="#edf5ff" font-weight="400" text-anchor="start">Kubernetes releases that earn their promotion.</text>
<text x="58" y="235" font-size="19" fill="#a9bbd1" font-weight="400" text-anchor="start">Immutable delivery. Paid testnet traffic. Measured failure and recovery.</text>
<rect x="58" y="280" width="188" height="32" rx="16" fill="#10263a" stroke="#53e3c2"/>
<text x="152" y="302" font-size="14" fill="#53e3c2" font-weight="700" text-anchor="middle">GITOPS + CHAOS</text>
<rect x="262" y="280" width="204" height="32" rx="16" fill="#10263a" stroke="#af9bff"/>
<text x="364" y="302" font-size="14" fill="#af9bff" font-weight="700" text-anchor="middle">x402 + PERMIT2</text>
<rect x="482" y="280" width="222" height="32" rx="16" fill="#10263a" stroke="#70b9ff"/>
<text x="593" y="302" font-size="14" fill="#70b9ff" font-weight="700" text-anchor="middle">VERIFIED TESTNET</text>
<circle cx="1100" cy="173" r="113" fill="#0a2433" stroke="#25475b"/>
<circle cx="1100" cy="173" r="95" fill="none" stroke="#28536a" stroke-dasharray="5 10"/>
<path d="M1100 93L1164 120V170C1164 218 1138 247 1100 263C1062 247 1036 218 1036 170V120Z" fill="#102d41" stroke="url(#accent)" stroke-width="4"/>
<path d="M1062 174L1086 198L1139 144" fill="none" stroke="#53e3c2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1006" cy="103" r="5" fill="#53e3c2"/>
<circle cx="1190" cy="242" r="5" fill="#af9bff"/>
