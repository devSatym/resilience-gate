<text x="495" y="494" font-size="23" fill="#edf5ff" font-weight="700" text-anchor="start">staging</text>
<text x="495" y="528" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">2 app replicas + signer</text>
<text x="495" y="557" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Paid load + serial pod faults</text>
<rect x="873" y="425" width="332" height="145" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="873" y="441" width="3" height="113" rx="1" fill="#53e3c2"/>
