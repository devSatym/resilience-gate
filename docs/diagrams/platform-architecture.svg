<text x="881" y="694" font-size="19" fill="#edf5ff" font-weight="700" text-anchor="start">Prometheus · Loki · Grafana</text>
<text x="881" y="728" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Scoring + sanitized evidence</text>
<text x="50" y="798" font-size="13" fill="#a9bbd1" font-weight="400" text-anchor="start">CONCEPTUAL SOURCE DIAGRAM · runtime evidence is linked separately</text>
