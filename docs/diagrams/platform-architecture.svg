<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Resilience Gate platform architecture</title>
<desc id="desc">GitHub Actions uses OIDC to publish Cosign-signed images. Kargo joins source and image identities, renders environment branches, and requests Argo CD reconciliation. Dev, staging and prod-like namespaces run on one two-node zonal GKE lab with Terraform, External Secrets, and observability.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#53e3c2"/><stop offset="1" stop-color="#70b9ff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#476079" opacity=".23"/></pattern>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#829db8"/></marker></defs>
<rect width="1280" height="820" rx="22" fill="url(#bg)"/>
<rect width="1280" height="820" rx="22" fill="url(#grid)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="50" y="43" font-size="14" fill="#53e3c2" font-weight="700" text-anchor="start">01 / PLATFORM ARCHITECTURE</text>
<text x="50" y="91" font-size="34" fill="#edf5ff" font-weight="700" text-anchor="start">One release identity. Three environments.</text>
<text x="50" y="126" font-size="19" fill="#a9bbd1" font-weight="400" text-anchor="start">Git source + OCI digest → rendered Git → reconciled workload → verification record</text>
<rect x="50" y="164" width="216" height="169" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="50" y="180" width="3" height="137" rx="1" fill="#70b9ff"/>
<text x="71" y="198" font-size="13" fill="#70b9ff" font-weight="700" text-anchor="start">SOURCE + CI</text>
<text x="71" y="233" font-size="19" fill="#edf5ff" font-weight="700" text-anchor="start">GitHub Actions</text>
<text x="71" y="267" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Validate + build</text>
<text x="71" y="296" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Keyless OIDC publish</text>
<path d="M268 248 L284 248" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="291" y="164" width="216" height="169" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="291" y="180" width="3" height="137" rx="1" fill="#af9bff"/>
<text x="312" y="198" font-size="13" fill="#af9bff" font-weight="700" text-anchor="start">SIGNED ARTIFACTS</text>
<text x="312" y="233" font-size="19" fill="#edf5ff" font-weight="700" text-anchor="start">Artifact Registry</text>
<text x="312" y="267" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">App · signer · gate</text>
<text x="312" y="296" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Cosign + OCI digests</text>
<path d="M509 248 L525 248" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="532" y="164" width="216" height="169" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="532" y="180" width="3" height="137" rx="1" fill="#53e3c2"/>
<text x="553" y="198" font-size="13" fill="#53e3c2" font-weight="700" text-anchor="start">CANDIDATE IDENTITY</text>
<text x="553" y="233" font-size="19" fill="#edf5ff" font-weight="700" text-anchor="start">Kargo Warehouse</text>
<text x="553" y="267" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Source + image Freight</text>
<text x="553" y="296" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Stage eligibility</text>
<path d="M750 248 L766 248" fill="none" stroke="#829db8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="773" y="164" width="216" height="169" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="773" y="180" width="3" height="137" rx="1" fill="#70b9ff"/>
<text x="794" y="198" font-size="13" fill="#70b9ff" font-weight="700" text-anchor="start">REVIEWABLE OUTPUT</text>
<text x="794" y="233" font-size="23" fill="#edf5ff" font-weight="700" text-anchor="start">Rendered Git</text>
<text x="794" y="267" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">env/dev · env/staging</text>
<text x="794" y="296" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">env/prod manifests</text>
