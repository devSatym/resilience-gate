<rect x="50" y="641" width="3" height="105" rx="1" fill="#70b9ff"/>
<text x="71" y="659" font-size="13" fill="#70b9ff" font-weight="700" text-anchor="start">FOUNDATION</text>
<text x="71" y="694" font-size="19" fill="#edf5ff" font-weight="700" text-anchor="start">Terraform + Workload Identity</text>
<text x="71" y="728" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">GCP infrastructure + IAM</text>
<rect x="455" y="625" width="370" height="137" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="455" y="641" width="3" height="105" rx="1" fill="#af9bff"/>
<text x="476" y="659" font-size="13" fill="#af9bff" font-weight="700" text-anchor="start">SECRET DELIVERY</text>
<text x="476" y="694" font-size="23" fill="#edf5ff" font-weight="700" text-anchor="start">Secret Manager → ESO</text>
<text x="476" y="728" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Values stay outside Git</text>
<rect x="860" y="625" width="370" height="137" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="860" y="641" width="3" height="105" rx="1" fill="#53e3c2"/>
