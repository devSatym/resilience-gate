<text x="96" y="494" font-size="23" fill="#edf5ff" font-weight="700" text-anchor="start">dev</text>
<text x="96" y="528" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">1 app replica</text>
<text x="96" y="557" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">PostgreSQL + Redis</text>
<rect x="474" y="425" width="332" height="145" rx="16" fill="#122139" stroke="#2a3e58"/>
<rect x="474" y="441" width="3" height="113" rx="1" fill="#af9bff"/>
