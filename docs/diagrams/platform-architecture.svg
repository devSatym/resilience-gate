<text x="1035" y="198" font-size="13" fill="#ffc776" font-weight="700" text-anchor="start">RECONCILIATION</text>
<text x="1035" y="233" font-size="23" fill="#edf5ff" font-weight="700" text-anchor="start">Argo CD</text>
<text x="1035" y="267" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Track env/* branches</text>
<text x="1035" y="296" font-size="17" fill="#a9bbd1" font-weight="400" text-anchor="start">Apply desired revision</text>
<rect x="50" y="365" width="1180" height="228" rx="16" fill="#0a1b2d" stroke="#46617b"/>
<text x="73" y="401" font-size="14" fill="#70b9ff" font-weight="700" text-anchor="start">EXISTING GKE STANDARD LAB</text>
<text x="1208" y="401" font-size="16" fill="#a9bbd1" font-weight="400" text-anchor="end">1 zone · 2 nodes · e2-standard-4</text>
