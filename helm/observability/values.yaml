# Namespaces with application ServiceMonitors. Adding one is a reviewed change
# because it deliberately expands telemetry collection scope.
appNamespaces:
  - url-shortener-dev
  - url-shortener-staging
  - url-shortener-prod

# This is a non-secret label on log streams, not an infrastructure credential.
clusterName: resilience-gate
lokiGatewayUrl: http://observability-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

kube-prometheus-stack:
  alertmanager:
    enabled: false

  grafana:
    admin:
      existingSecret: grafana-admin-secret
      userKey: username
      passwordKey: password
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://observability-loki-gateway.monitoring.svc.cluster.local
        isDefault: false
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 8GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # ServiceMonitors are selected by an explicit label rather than by a
      # release-wide catch-all. Namespace selection is intentionally broad so
      # the small reviewed allowlist above can span environments.
      serviceMonitorSelector:
        matchLabels:
          release: observability
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelectorNilUsesHelmValues: false

loki:
  deploymentMode: SingleBinary
  gateway:
    enabled: true
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 72h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: standard
      size: 10Gi
  # The upstream chunks-cache default reserves about 9.8Gi, which cannot fit
  # on this two-node e2-standard-2 lab. Keep the cache behavior but size its
  # managed memcached allocation to the same bounded 1Gi profile as results.
  chunksCache:
    enabled: true
    allocatedMemory: 1024
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

# Alloy uses the Kubernetes API log source rather than the retired Promtail
# chart or host-path scraping. A single replica avoids duplicate log streams.
alloy:
  controller:
    type: deployment
    replicas: 1
  alloy:
    configMap:
      create: false
      name: observability-alloy-config
      key: config.alloy
    enableReporting: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
  serviceAccount:
    create: true
    automountServiceAccountToken: true
