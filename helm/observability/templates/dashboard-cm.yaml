apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  url-shortener.json: |
    {
      "uid": "resilience-gate-app",
      "title": "Resilience Gate — application and payment health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "tags": ["resilience-gate", "payments"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "custom",
            "query": "url-shortener-dev,url-shortener-staging,url-shortener-prod",
            "current": {"text": "url-shortener-staging", "value": "url-shortener-staging"},
            "options": [
              {"text": "url-shortener-dev", "value": "url-shortener-dev"},
              {"text": "url-shortener-staging", "value": "url-shortener-staging"},
              {"text": "url-shortener-prod", "value": "url-shortener-prod"}
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate by handler",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\"}[1m])) by (handler,method)",
            "legendFormat": "{{ "{{handler}} {{method}}" }}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 request duration",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "refId": "A",
            "expr": "histogram_quantile(0.95,sum(rate(http_request_duration_seconds_bucket{job=\"url-shortener\",namespace=\"$namespace\"}[5m])) by (le,handler))*1000",
            "legendFormat": "{{ "{{handler}}" }}"
          }],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Paid shorten success rate (5m)",
          "description": "201 responses divided by all POST /shorten responses. No traffic is displayed as 0 rather than a fabricated success.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 8, "w": 6, "h": 5},
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler=\"/shorten\",method=\"POST\",status=\"201\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler=\"/shorten\",method=\"POST\"}[5m])),1)"
          }],
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.9}, {"color": "green", "value": 0.95}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Payment replay attempts",
          "description": "Application-level UNIQUE constraint failures for settlement transaction hashes.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 6, "y": 8, "w": 6, "h": 5},
          "targets": [{"refId": "A", "expr": "sum(payment_replay_attempts_total{job=\"url-shortener\",namespace=\"$namespace\"}) or vector(0)"}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Payment outcomes and facilitator latency",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 5},
          "targets": [
            {"refId": "A", "expr": "sum(rate(payment_402_responses_total{job=\"url-shortener\",namespace=\"$namespace\"}[5m]))", "legendFormat": "402/s"},
            {"refId": "B", "expr": "histogram_quantile(0.95,sum(rate(payment_facilitator_duration_seconds_bucket{job=\"url-shortener\",namespace=\"$namespace\"}[5m])) by (le))*1000", "legendFormat": "facilitator p95"}
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Dependency availability",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 13, "w": 24, "h": 7},
          "targets": [{
            "refId": "A",
            "expr": "url_shortener_dependency_up{job=\"url-shortener\",namespace=\"$namespace\"}",
            "legendFormat": "{{ "{{dependency}}" }}"
          }],
          "fieldConfig": {"defaults": {"min": 0, "max": 1}}
        }
      ]
    }
