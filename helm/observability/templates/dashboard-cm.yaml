apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  url-shortener.json: |
    {
      "uid": "resilience-gate-app",
      "title": "Resilience Gate — application health",
      "description": "HTTP service health, latency, dependencies, and cache behavior.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "timezone": "utc",
      "tags": ["resilience-gate", "application"],
      "links": [{
        "asDropdown": true,
        "icon": "dashboard",
        "includeVars": true,
        "keepTime": true,
        "tags": ["resilience-gate"],
        "targetBlank": false,
        "title": "Resilience Gate dashboards",
        "type": "dashboards"
      }],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "custom",
            "query": "url-shortener-dev,url-shortener-staging,url-shortener-prod",
            "current": {"text": "url-shortener-staging", "value": "url-shortener-staging"},
            "options": [
              {"text": "url-shortener-dev", "value": "url-shortener-dev"},
              {"text": "url-shortener-staging", "value": "url-shortener-staging"},
              {"text": "url-shortener-prod", "value": "url-shortener-prod"}
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate by route and status",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{
            "refId": "A",
            "expr": "sum by (handler,status) (rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\"}[1m]))",
            "legendFormat": "{{ "{{handler}} {{status}}" }}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request latency by route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50,sum by (le,handler) (rate(http_request_duration_seconds_bucket{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\"}[5m])))*1000",
              "legendFormat": "{{ "{{handler}} p50" }}"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95,sum by (le,handler) (rate(http_request_duration_seconds_bucket{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\"}[5m])))*1000",
              "legendFormat": "{{ "{{handler}} p95" }}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ms"}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Requests in selected range",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 8, "w": 6, "h": 5},
          "targets": [{
            "refId": "A",
            "expr": "sum(increase(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\"}[$__range])) or vector(0)"
          }],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "5xx share (5m)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 6, "y": 8, "w": 6, "h": 5},
          "targets": [{
            "refId": "A",
            "expr": "100 * sum(rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"url-shortener\",namespace=\"$namespace\",handler!~\"/(livez|ready|metrics)\"}[5m])),0.000001)"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Dependency availability",
          "description": "Minimum reported state across application replicas; 1 is reachable and 0 is unavailable.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 5},
          "targets": [{
            "refId": "A",
            "expr": "min by (dependency) (url_shortener_dependency_up{job=\"url-shortener\",namespace=\"$namespace\"})",
            "legendFormat": "{{ "{{dependency}}" }}"
          }],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "decimals": 0}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Redis cache activity",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 13, "w": 12, "h": 7},
          "targets": [
            {"refId": "A", "expr": "sum(rate(url_shortener_cache_hits_total{job=\"url-shortener\",namespace=\"$namespace\"}[1m]))", "legendFormat": "hits/s"},
            {"refId": "B", "expr": "sum(rate(url_shortener_cache_misses_total{job=\"url-shortener\",namespace=\"$namespace\"}[1m]))", "legendFormat": "misses or fallbacks/s"}
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Short URLs created",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 13, "w": 12, "h": 7},
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(url_shortener_urls_created_total{job=\"url-shortener\",namespace=\"$namespace\"}[1m]))",
            "legendFormat": "created/s"
          }],
          "fieldConfig": {"defaults": {"unit": "ops"}}
        }
      ]
    }
