# Fragile staging overlay, stacked on values-staging.yaml for the failure demo.
# Deliberately brittle: a single application replica with no application PDB
# (one pod kill = full outage), a 2s facilitator timeout that trips under
# injected network latency, and no persistence, so chaos blast radius is
# amplified.

replicaCount: 1

placement:
  podAntiAffinity:
    enabled: false
podDisruptionBudget:
  enabled: false

payments:
  timeoutSeconds: "2"      # times out under 3s+ network latency injection

postgresql:
  primary:
    persistence:
      enabled: false          # data lost on pod restart

redis:
  master:
    persistence:
      enabled: false          # cache lost on pod restart
