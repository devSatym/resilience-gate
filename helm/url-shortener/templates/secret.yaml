{{- if not .Values.externalSecrets.enabled }}
{{- $databasePassword := required "postgresql.auth.password is required when externalSecrets.enabled=false" .Values.postgresql.auth.password }}
{{- $redisPassword := required "redis.auth.password is required when externalSecrets.enabled=false" .Values.redis.auth.password }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "url-shortener.credentialsSecretName" . }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.username ($databasePassword | urlquery | replace "+" "%20") (include "url-shortener.postgresHost" .) .Values.postgresql.auth.database | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:6379/0" ($redisPassword | urlquery | replace "+" "%20") (include "url-shortener.redisHost" .) | quote }}
  # The two lower-case keys are consumed by the Bitnami PostgreSQL dependency
  # when an environment switches to an existing secret.
  password: {{ $databasePassword | quote }}
  postgres-password: {{ $databasePassword | quote }}
  redis-password: {{ $redisPassword | quote }}
  {{- if .Values.payments.enabled }}
  SERVICE_WALLET_ADDRESS: {{ required "payments.localServiceWalletAddress is required for a local paid render" .Values.payments.localServiceWalletAddress | quote }}
  {{- end }}
{{- end }}
