{{- if .Values.externalSecrets.enabled }}
{{- $credentialsSecretName := include "url-shortener.credentialsSecretName" . }}
{{- if ne .Values.postgresql.auth.existingSecret $credentialsSecretName }}
{{- fail "postgresql.auth.existingSecret must equal the ExternalSecret target name" }}
{{- end }}
{{- if ne .Values.redis.auth.existingSecret $credentialsSecretName }}
{{- fail "redis.auth.existingSecret must equal the ExternalSecret target name" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "url-shortener.fullname" . }}-external-secret
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ $credentialsSecretName }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy }}
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ "{{" }} .database_url {{ "}}" }}"
        REDIS_URL: "{{ "{{" }} .redis_url {{ "}}" }}"
        password: "{{ "{{" }} .database_password {{ "}}" }}"
        postgres-password: "{{ "{{" }} .database_password {{ "}}" }}"
        redis-password: "{{ "{{" }} .redis_password {{ "}}" }}"
        {{- if .Values.payments.enabled }}
        SERVICE_WALLET_ADDRESS: "{{ "{{" }} .service_wallet_address {{ "}}" }}"
        {{- end }}
  data:
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.databaseUrlKey | quote }}
    - secretKey: database_password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.databasePasswordKey | quote }}
    - secretKey: redis_url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.redisUrlKey | quote }}
    - secretKey: redis_password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.redisPasswordKey | quote }}
    {{- if .Values.payments.enabled }}
    - secretKey: service_wallet_address
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.serviceWalletAddressKey | quote }}
    {{- end }}
{{- end }}
