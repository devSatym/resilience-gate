apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: resilience-gate
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  # Exact names deliberately avoid broad selectors. Development is the only
  # automatic transition; staging and production-like testnet releases require
  # an explicit, auditable promotion.
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: staging
      autoPromotionEnabled: false
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
