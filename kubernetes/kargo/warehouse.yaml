# Run `make render-config` before applying this manifest. Repository and
# registry identifiers are public operator configuration, not repository-owned
# identities. Each selected image is carried into Freight by OCI digest.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: resilience-gate
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  subscriptions:
    # CI's sha-* labels are discovery hints only. The promotion templates use
    # the Freight digest, never this mutable lookup tag, as deployment identity.
    - image:
        repoURL: "us-central1-docker.pkg.dev/shivam-serverless/resilience-gate/url-shortener"
        imageSelectionStrategy: NewestBuild
        # Kargo v1.3 accepts one allowTags regular expression. The strict
        # sha-only pattern excludes mutable and non-release CI tags.
        allowTags: "^sha-[a-f0-9]{7,40}$"
    # The rendered env/* branches are outputs, never Freight sources. Only the
    # chart and environment values on main create a new source revision.
    - git:
        repoURL: "https://github.com/devSatym/resilience-gate.git"
        branch: main
        includePaths:
          - helm/url-shortener
