# Reusable in-cluster readiness check. Staging supplies release identity args
# as well because Argo Rollouts requires every referenced template to declare
# the Stage's verification arguments, even when this metric does not use them.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: service-health
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  args:
    - name: service-url
    - name: release-revision
      value: not-used
    - name: release-digest
      value: not-used
  metrics:
    - name: readiness
      count: 3
      interval: 15s
      failureLimit: 0
      consecutiveSuccessLimit: 2
      provider:
        web:
          url: "{{args.service-url}}/ready"
          timeoutSeconds: 5
          jsonPath: "{$.status}"
      successCondition: result == "ready"
---
# The staging gate is a single bounded Job. The gate-runner reference always
# uses a sha256 digest; the renderer's zero-digest sentinel is intentionally
# unresolvable until a signed CI artifact is reviewed into this manifest.
# Changing code never relies on a ConfigMap mutation at runtime.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: chaos-gate
  namespace: resilience-gate
  labels:
    app.kubernetes.io/component: chaos-gate
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  args:
    - name: service-url
      value: not-used
    - name: release-revision
    - name: release-digest
  metrics:
    - name: chaos-verdict
      count: 1
      failureLimit: 0
      provider:
        job:
          metadata:
            labels:
              app.kubernetes.io/component: chaos-gate
              app.kubernetes.io/part-of: resilience-gate
          spec:
            backoffLimit: 0
            # 90s loadgen startup + 660s workflow + three 105s scorecards +
            # 15s optional annotation + 120s verified cleanup + 60s reserve.
            # The runner rejects a smaller local budget before it injects a fault.
            activeDeadlineSeconds: 1320
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  app.kubernetes.io/component: chaos-gate
                  app.kubernetes.io/part-of: resilience-gate
              spec:
                serviceAccountName: chaos-gate
                automountServiceAccountToken: true
                enableServiceLinks: false
                restartPolicy: Never
                # Allow the runner's bounded, exact cleanup trap to finish if
                # Kubernetes terminates the Job at its active deadline.
                terminationGracePeriodSeconds: 120
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: chaos-gate
                    image: "us-central1-docker.pkg.dev/shivam-serverless/resilience-gate/gate-runner@sha256:0a8674b0f2ca2a31422e92908c914d23e73427594815d8c08ffba65e660d4923"
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: RUN_ID
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.uid
                      - name: RELEASE_REVISION
                        value: "{{args.release-revision}}"
                      - name: RELEASE_DIGEST
                        value: "{{args.release-digest}}"
                      - name: SCORECARD_DIR
                        value: /results
                      - name: GRAFANA_URL
                        value: http://observability-grafana.monitoring.svc.cluster.local
                      - name: GRAFANA_USER
                        value: admin
                      - name: GRAFANA_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: grafana-annotation
                            key: password
                            # Grafana annotations are diagnostic only; a missing
                            # optional ExternalSecret must not prevent the gate
                            # container from starting and producing its verdict.
                            optional: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    volumeMounts:
                      - name: results
                        mountPath: /results
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: results
                    emptyDir:
                      sizeLimit: 16Mi
                  - name: tmp
                    emptyDir:
                      sizeLimit: 16Mi
---
# A production-like testnet promotion requires both readiness and liveness
# after Argo CD has reconciled the digest-pinned render. It does not substitute
# for the staging chaos verification that upstream Freight must already pass.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prod-post-deploy-health
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  args:
    - name: service-url
  metrics:
    - name: readiness
      count: 3
      interval: 15s
      failureLimit: 0
      consecutiveSuccessLimit: 2
      provider:
        web:
          url: "{{args.service-url}}/ready"
          timeoutSeconds: 5
          jsonPath: "{$.status}"
      successCondition: result == "ready"
    - name: liveness
      count: 2
      interval: 15s
      failureLimit: 0
      consecutiveSuccessLimit: 2
      provider:
        web:
          url: "{{args.service-url}}/livez"
          timeoutSeconds: 5
          jsonPath: "{$.status}"
      successCondition: result == "alive"
