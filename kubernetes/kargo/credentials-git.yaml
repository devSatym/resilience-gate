# Run `make render-config` before applying this manifest. The public repository
# identity comes from local operator configuration; the token remains in the
# external secret backend and is never committed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-credentials
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: kargo-git-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Kargo discovers git credentials only through this credential type.
          kargo.akuity.io/cred-type: git
      data:
        repoURL: "{{GITHUB_REPOSITORY_URL}}"
        username: "{{GITHUB_OWNER}}"
        password: "{{ .githubPat }}"
  data:
    - secretKey: githubPat
      remoteRef:
        key: github-pat
