# Kargo creates the Project namespace. This project is intentionally limited to
# the owned testnet promotion chain; it is not a live-network release control.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  # Kargo v1.3 owns promotion policy on the Project itself. Development may
  # promote discovered Freight automatically; staging and production-like
  # testnet stages remain explicit, auditable operator actions.
  promotionPolicies:
    - stage: dev
      autoPromotionEnabled: true
    - stage: staging
      autoPromotionEnabled: false
    - stage: prod
      autoPromotionEnabled: false
