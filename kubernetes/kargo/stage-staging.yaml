# Staging accepts only Freight that has completed development verification. A
# manually requested staging promotion cannot become downstream Freight until
# both in-cluster readiness and the immutable, bounded chaos gate pass.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: resilience-gate
  labels:
    app.kubernetes.io/part-of: resilience-gate
    resilience-gate.io/scope: testnet-only
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: resilience-gate
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: "https://github.com/devSatym/resilience-gate.git"
        - name: imageRepo
          value: "us-central1-docker.pkg.dev/shivam-serverless/resilience-gate/url-shortener"
        - name: sourcePath
          value: ./src
        - name: renderedPath
          value: ./out
        - name: targetBranch
          value: env/${{ ctx.stage }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
                path: ${{ vars.sourcePath }}
              - branch: ${{ vars.targetBranch }}
                create: true
                path: ${{ vars.renderedPath }}
        - uses: yaml-update
          config:
            path: ${{ vars.sourcePath }}/helm/url-shortener/values-${{ ctx.stage }}.yaml
            updates:
              - key: image.repository
                value: ${{ vars.imageRepo }}
              - key: image.digest
                value: ${{ imageFrom(vars.imageRepo).Digest }}
        - uses: git-clear
          config:
            path: ${{ vars.renderedPath }}
        - uses: helm-template
          config:
            path: ${{ vars.sourcePath }}/helm/url-shortener
            releaseName: url-shortener-${{ ctx.stage }}
            namespace: url-shortener-${{ ctx.stage }}
            valuesFiles:
              - ${{ vars.sourcePath }}/helm/url-shortener/values.yaml
              - ${{ vars.sourcePath }}/helm/url-shortener/values-${{ ctx.stage }}.yaml
            outPath: ${{ vars.renderedPath }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.renderedPath }}
            message: "render ${{ ctx.stage }} from ${{ commitFrom(vars.gitopsRepo).ID }} with ${{ imageFrom(vars.imageRepo).Digest }}"
        - uses: git-push
          config:
            path: ${{ vars.renderedPath }}
            targetBranch: ${{ vars.targetBranch }}
        - uses: argocd-update
          config:
            apps:
              - name: resilience-gate-${{ ctx.stage }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitopsRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
  verification:
    analysisTemplates:
      - name: service-health
      - name: chaos-gate
    args:
      - name: service-url
        value: http://url-shortener-${{ ctx.stage }}.url-shortener-${{ ctx.stage }}.svc.cluster.local
      # Bind scorecards to exactly the Git source and immutable image Freight
      # that rendered this staging revision; neither value comes from a tag.
      - name: release-revision
        value: ${{ commitFrom("https://github.com/devSatym/resilience-gate.git").ID }}
      - name: release-digest
        value: ${{ imageFrom("us-central1-docker.pkg.dev/shivam-serverless/resilience-gate/url-shortener").Digest }}
