# Run `make render-config` before applying this public GitOps manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repository
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: repo-resilience-gate
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "{{GITHUB_REPOSITORY_URL}}"
        username: "{{GITHUB_OWNER}}"
        password: "{{ .github_pat }}"
  data:
    - secretKey: github_pat
      remoteRef:
        key: github-pat
