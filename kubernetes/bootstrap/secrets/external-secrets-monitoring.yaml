apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    # The monitoring namespace and child Application are introduced first by
    # observability.yaml (waves 1 and 2 respectively).
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .grafana_admin_password }}"
  data:
    - secretKey: grafana_admin_password
      remoteRef:
        key: resilience-gate-grafana-admin-password
