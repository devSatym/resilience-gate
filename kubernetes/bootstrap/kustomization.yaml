apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # C055: establish GitOps access only. Future workloads are intentionally not
  # listed here until their own reviewed phase adds them.
  - secrets/cluster-secret-store.yaml
  - secrets/external-secrets-argocd.yaml
  # C060: telemetry namespace, Application, and credentials must exist before
  # metric-driven gates are introduced.
  - observability.yaml
  - secrets/external-secrets-monitoring.yaml
  # Dev and prod are explicit bootstrap-owned destinations. Staging is the
  # separately annotated Chaos Mesh namespace below.
  - workload-namespaces.yaml
  # C064: GitOps registers only a suspended load generator; a manual runner
  # creates one-off testnet Jobs after explicit review.
  - chaos-jobs.yaml
  # C089 integration correction: C074 defined these constrained Chaos Mesh
  # resources, and the complete gate must make them reachable before it can
  # ever create a bounded Workflow.
  - chaos-mesh-ns-annotation.yaml
  - chaos-mesh.yaml
  # C089: the Application carries only immutable gate configuration. It is
  # registered after observability, Chaos Mesh, and the suspended loadgen job.
  - chaos-gate.yaml
