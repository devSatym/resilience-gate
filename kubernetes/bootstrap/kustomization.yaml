apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # C055: establish GitOps access only. Future workloads are intentionally not
  # listed here until their own reviewed phase adds them.
  - secrets/cluster-secret-store.yaml
  - secrets/external-secrets-argocd.yaml
  # C060: telemetry namespace, Application, and credentials must exist before
  # metric-driven gates are introduced.
  - observability.yaml
  - secrets/external-secrets-monitoring.yaml
  # C064: GitOps registers only a suspended load generator; a manual runner
  # creates one-off testnet Jobs after explicit review.
  - chaos-jobs.yaml
