# Bounded PostgreSQL dependency unavailability. The selector is tied to the
# staging Helm release and primary component so it cannot target another
# environment or a read replica.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: postgres-pod-failure
  namespace: url-shortener-staging
spec:
  action: pod-failure
  mode: one
  duration: 60s
  selector:
    namespaces:
      - url-shortener-staging
    labelSelectors:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: url-shortener-staging
      app.kubernetes.io/component: primary
