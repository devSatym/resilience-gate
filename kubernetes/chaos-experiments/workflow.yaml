# The workflow is intentionally serial: a baseline period precedes the first
# fault, and every fault has its own bounded recovery observation window.
# In a Chaos Mesh Workflow the node deadline, rather than a nested duration,
# bounds a PodChaos node.
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  generateName: chaos-gate-
  namespace: url-shortener-staging
  labels:
    app: chaos-gate
    app.kubernetes.io/component: chaos-gate
    app.kubernetes.io/part-of: resilience-gate
    # The runner refuses to begin while an earlier object with this selector
    # remains. Its own generated Workflow is additionally labelled with a
    # unique run id after the run-scoped loadgen has proved paid traffic.
    resilience-gate.io/gate: chaos
spec:
  entry: gate-serial
  templates:
    - name: gate-serial
      templateType: Serial
      # 510 seconds of declared child windows plus scheduler headroom.
      deadline: 660s
      children:
        - baseline
        - postgres
        - postgres-recovery
        - redis
        - redis-recovery
        - signer
        - signer-recovery

    - name: baseline
      templateType: Suspend
      # Lets independently-started load generation reach a steady state.
      deadline: 90s

    - name: postgres
      templateType: PodChaos
      deadline: 60s
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: primary

    - name: postgres-recovery
      templateType: Suspend
      # A separate window keeps recovery observations distinct from the fault.
      deadline: 120s

    - name: redis
      templateType: PodChaos
      deadline: 60s
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: master

    - name: redis-recovery
      templateType: Suspend
      deadline: 60s

    - name: signer
      templateType: PodChaos
      deadline: 60s
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app: radius-signer
            app.kubernetes.io/name: radius-signer
            app.kubernetes.io/component: signer
            app.kubernetes.io/part-of: resilience-gate

    - name: signer-recovery
      templateType: Suspend
      deadline: 60s
