# Grafana admin credential for the chaos-gate's non-fatal verdict annotation.
# It is deliberately copied into the Kargo project namespace where an
# AnalysisTemplate Job runs; the runner receives no broad monitoring secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-annotation
  namespace: resilience-gate
  labels:
    app.kubernetes.io/component: chaos-gate
    app.kubernetes.io/part-of: resilience-gate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: grafana-annotation
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: resilience-gate-grafana-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
