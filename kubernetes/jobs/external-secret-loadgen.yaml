apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resilience-gate-loadgen
  namespace: url-shortener-staging
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: resilience-gate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: resilience-gate-loadgen-credentials
    creationPolicy: Owner
  # This is deliberately the smallest possible load-generator secret. It
  # contains a public merchant address, never payer private keys or RPC access.
  data:
    - secretKey: SERVICE_WALLET_ADDRESS
      remoteRef:
        key: resilience-gate/staging/service-wallet-address-testnet
