apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resilience-gate-signer
  namespace: url-shortener-staging
  labels:
    app.kubernetes.io/name: radius-signer
    app.kubernetes.io/component: signer
    app.kubernetes.io/part-of: resilience-gate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: resilience-gate-secrets
    kind: ClusterSecretStore
  target:
    name: resilience-gate-signer-credentials
    creationPolicy: Owner
  # The signer is the only workload that receives payer private keys. The
  # load generator receives only the public merchant address in its own Secret.
  data:
    - secretKey: RPC_URL
      remoteRef:
        key: resilience-gate-staging-signer-rpc-url-testnet
    - secretKey: SERVICE_WALLET_ADDRESS
      remoteRef:
        key: resilience-gate-staging-service-wallet-address-testnet
    - secretKey: WALLET_KEY_1
      remoteRef:
        key: resilience-gate-staging-loadgen-wallet-key-1-testnet
    - secretKey: WALLET_KEY_2
      remoteRef:
        key: resilience-gate-staging-loadgen-wallet-key-2-testnet
    - secretKey: WALLET_KEY_3
      remoteRef:
        key: resilience-gate-staging-loadgen-wallet-key-3-testnet
