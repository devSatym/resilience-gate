apiVersion: apps/v1
kind: Deployment
metadata:
  name: radius-signer
  namespace: url-shortener-staging
  labels:
    app: radius-signer
    app.kubernetes.io/name: radius-signer
    app.kubernetes.io/component: signer
    app.kubernetes.io/part-of: resilience-gate
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: radius-signer
      app.kubernetes.io/name: radius-signer
  template:
    metadata:
      labels:
        app: radius-signer
        app.kubernetes.io/name: radius-signer
        app.kubernetes.io/component: signer
        app.kubernetes.io/part-of: resilience-gate
    spec:
      # The signer makes no Kubernetes API calls. It has no token to exfiltrate.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radius-signer
          # Replaced only by a verified signer artifact workflow. The digest
          # syntax prevents a mutable tag from silently changing the workload.
          image: registry.example.invalid/resilience-gate/permit2-signer@sha256:4444444444444444444444444444444444444444444444444444444444444444
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: resilience-gate-signer-credentials
          env:
            - name: CHAIN_ID
              value: "72344"
            - name: NETWORK_CAIP2
              value: "eip155:72344"
            - name: SBC_CONTRACT_ADDRESS
              value: "0x33ad9e4bd16b69b5bfded37d8b5d9ff9aba014fb"
            - name: PERMIT2_CONTRACT_ADDRESS
              value: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
            - name: X402_PROXY_ADDRESS
              value: "0x402085c248EeA27D92E8b30b2C58ed07f9E20001"
            - name: SBC_AMOUNT
              value: "1000"
            - name: DEADLINE_SECONDS
              value: "300"
            - name: MAX_DEADLINE_SECONDS
              value: "300"
            - name: RPC_TIMEOUT_SECONDS
              value: "10"
            # Three sequential wallet bootstraps remain bounded within the
            # startup-probe budget. Signing itself never performs RPC work.
            - name: APPROVAL_TX_TIMEOUT_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            # Three bounded RPC/approval bootstraps may occur sequentially.
            # Keep the total startup budget below four minutes without using
            # readiness as a restart trigger.
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Boot-time RPC/approval failures must make the signer unready,
            # not cause a liveness restart loop.
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: radius-signer
  namespace: url-shortener-staging
  labels:
    app.kubernetes.io/name: radius-signer
    app.kubernetes.io/component: signer
    app.kubernetes.io/part-of: resilience-gate
spec:
  type: ClusterIP
  selector:
    app: radius-signer
    app.kubernetes.io/name: radius-signer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: radius-signer
  namespace: url-shortener-staging
  labels:
    app.kubernetes.io/name: radius-signer
    app.kubernetes.io/component: signer
    app.kubernetes.io/part-of: resilience-gate
    # Must match the kube-prometheus-stack ServiceMonitor selector.
    release: observability
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: radius-signer
      app.kubernetes.io/component: signer
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
