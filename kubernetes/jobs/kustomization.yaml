apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-shortener-staging

resources:
  # C061: signer and narrowly scoped credential contracts.
  - external-secret-loadgen.yaml
  - external-secret-signer.yaml
  - radius-signer.yaml
  # C064: a suspended CronJob; Argo CD must never start a load run on sync.
  - loadgen-job.yaml

# C064: let Kustomize hash the script ConfigMap. A changed script therefore
# changes the CronJob pod template instead of reusing a mutable ConfigMap name.
configMapGenerator:
  - name: k6-loadgen-script
    files:
      - loadgen.js=scripts/loadgen.js
